[project]
name = "awesome-jt"
version = "0.1.0"
authors = [
    { name = "Antonio Bevilacqua", email = "b3by.in.th3.sky@gmail.com" }
]
description = "Simple collection of Juturna plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "juturna>=2.0.0",
    "numpy"
]

[project.optional-dependencies]
proc-matrixgenerator = [
    "numpy"
]

proc = [
    "awesome-jt[proc-matrixgenerator]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juturna"]